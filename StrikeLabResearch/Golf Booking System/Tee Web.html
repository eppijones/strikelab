<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>tee. — web</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #2a2924; }
  body { font-family: 'Geist', -apple-system, system-ui, sans-serif; color: #0E1410; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { display: none; }
  .stage { width: 100vw; height: 100vh; display: grid; place-items: center; padding: 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="frames/browser-window.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel">
const { useState } = React;

// ─────────────────────────────────────────────────────────────
// Web nav
// ─────────────────────────────────────────────────────────────
function WebNav({ lang, setLang }) {
  const items = lang === 'no'
    ? ['Oppdag', 'Klubber', 'Medlemskap', 'Turneringer']
    : ['Discover', 'Clubs', 'Members', 'Tournaments'];
  return (
    <nav style={{
      position: 'sticky', top: 0, zIndex: 50,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '20px 48px',
      background: 'rgba(244,240,232,0.85)', backdropFilter: 'blur(14px) saturate(180%)',
      borderBottom: `1px solid ${TEE.hairline2}`,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 48 }}>
        <BrandMark size={26}/>
        <div style={{ display: 'flex', gap: 28, fontFamily: FONT_UI, fontSize: 13.5, color: TEE.ink2 }}>
          {items.map((x, i) => (
            <a key={i} href="#" style={{
              color: i === 0 ? TEE.ink : TEE.ink2,
              textDecoration: 'none', fontWeight: i === 0 ? 500 : 400,
            }}>{x}</a>
          ))}
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '8px 14px', borderRadius: 999,
          background: TEE.cream, border: `1px solid ${TEE.hairline2}`,
          fontFamily: FONT_UI, fontSize: 12.5, color: TEE.graphite, minWidth: 280,
        }}>
          <Icon kind="pin" size={13} color={TEE.graphite} strokeWidth={1.4}/>
          <span style={{ flex: 1 }}>{lang==='no'?'Søk i 174 baner i Norge':'Search 174 courses in Norway'}</span>
          <span style={{
            fontFamily: FONT_MONO, fontSize: 10.5, padding: '2px 6px',
            border: `1px solid ${TEE.hairline}`, borderRadius: 4,
          }}>⌘K</span>
        </div>
        <LangToggle lang={lang} setLang={setLang}/>
        <div style={{
          width: 34, height: 34, borderRadius: 999,
          background: TEE.moss, color: TEE.cream,
          display:'flex', alignItems:'center', justifyContent:'center',
          fontFamily: FONT_DISPLAY, fontSize: 14, fontWeight: 500,
        }}>M</div>
      </div>
    </nav>
  );
}

// ─────────────────────────────────────────────────────────────
// Hero — editorial split
// ─────────────────────────────────────────────────────────────
function Hero({ lang }) {
  const t = (k) => TEE_DATA.i18n[lang][k] || k;
  return (
    <section style={{ padding: '60px 48px 40px' }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 56, alignItems: 'end' }}>
        <div>
          <div style={{
            fontFamily: FONT_UI, fontSize: 11.5, letterSpacing: 1.2, textTransform: 'uppercase',
            color: TEE.graphite, marginBottom: 18,
          }}>
            {todayLabel(lang)} · 18° · 5 m/s SW · {t('sunset')} 21:12
          </div>
          <h1 style={{
            fontFamily: FONT_DISPLAY, fontSize: 100, fontWeight: 400,
            letterSpacing: -3.5, lineHeight: 0.95, margin: 0, color: TEE.ink,
          }}>
            {lang === 'no' ? <>Spill mer.<br/><span style={{ fontStyle: 'italic', color: TEE.moss }}>Bestill mindre.</span></>
                            : <>Play more.<br/><span style={{ fontStyle: 'italic', color: TEE.moss }}>Book less.</span></>}
          </h1>
          <p style={{
            fontFamily: FONT_DISPLAY, fontSize: 19, color: TEE.ink2,
            lineHeight: 1.45, margin: '24px 0 0', maxWidth: 460, fontStyle: 'italic',
          }}>
            {lang === 'no'
              ? 'Velg banen som et sted, ikke et regneark. Vinduet viser deg dagen som landskap — sol, vind, ledige tider — slik at du finner øyeblikket, ikke bare en tid.'
              : "Pick a course like a place, not a spreadsheet. The Window shows the day as landscape — sun, wind, openings — so you find a moment, not just a time."}
          </p>
          <div style={{ marginTop: 32, display: 'flex', gap: 12 }}>
            <button style={{
              appearance:'none', border:'none', cursor:'pointer',
              padding: '14px 24px', borderRadius: 999,
              background: TEE.ink, color: TEE.cream,
              fontFamily: FONT_UI, fontSize: 14, fontWeight: 500,
              display:'inline-flex', alignItems:'center', gap: 8,
            }}>
              {lang==='no'?'Finn et vindu nå':'Find a window now'}
              <Icon kind="arrow-right" size={15} strokeWidth={1.6}/>
            </button>
            <button style={{
              appearance:'none', cursor:'pointer',
              padding: '14px 22px', borderRadius: 999,
              background: 'transparent', color: TEE.ink2,
              border: `1px solid ${TEE.hairline}`,
              fontFamily: FONT_UI, fontSize: 14, fontWeight: 500,
            }}>{lang==='no'?'Hvordan tee. fungerer':'How tee. works'}</button>
          </div>
        </div>

        {/* Featured Window card on the right */}
        <FeaturedWindowCard lang={lang}/>
      </div>
    </section>
  );
}

function FeaturedWindowCard({ lang }) {
  const t = (k) => TEE_DATA.i18n[lang][k] || k;
  const course = TEE_DATA.courses.find(c => c.id === 'miklagard');
  const W = 360, H = 110;
  const startH = 5, endH = 21;
  const xFor = (h) => 16 + ((h - startH) / (endH - startH)) * (W - 32);
  let arc = `M ${xFor(5)} ${H-12}`;
  course.hourly.forEach(p => { arc += ` L ${xFor(p.h)} ${(H-14) - p.sun*(H-30)}`; });
  arc += ` L ${xFor(21)} ${H-12} Z`;

  return (
    <div style={{
      background: TEE.ink, color: TEE.cream, borderRadius: 22, padding: 28,
      position: 'relative', overflow:'hidden',
      boxShadow: '0 30px 80px -30px rgba(14,20,16,0.5)',
    }}>
      <div style={{
        position:'absolute', inset: 0, opacity: 0.18,
      }}>
        <HeroLandscape kind={course.hero} height={400}/>
      </div>
      <div style={{ position:'relative' }}>
        <div style={{
          display:'flex', justifyContent:'space-between', alignItems:'center',
          fontFamily: FONT_UI, fontSize: 10.5, letterSpacing: 1, textTransform: 'uppercase',
          color: 'rgba(251,250,246,0.6)',
        }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap:8 }}>
            <span style={{ width:6, height:6, borderRadius:999, background: TEE.sun }}/>
            {lang==='no'?'Anbefalt for deg nå':'Picked for you, right now'}
          </span>
          <span>★ {t('perfectWindow')}</span>
        </div>

        <div style={{ marginTop: 16, fontFamily: FONT_DISPLAY, fontSize: 36, letterSpacing: -0.8, lineHeight: 1.05, fontWeight: 500 }}>
          {course.name}
        </div>
        <div style={{ marginTop: 4, fontFamily: FONT_MONO, fontSize: 12, color: 'rgba(251,250,246,0.55)' }}>
          {course.location} · 36 min
        </div>

        {/* Mini window viz */}
        <div style={{ marginTop: 22 }}>
          <svg viewBox={`0 0 ${W} ${H}`} style={{ display:'block', width:'100%', height: H }}>
            <defs>
              <linearGradient id="hero-sun" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stopColor="rgba(232,181,71,0.55)"/>
                <stop offset="1" stopColor="rgba(232,181,71,0.05)"/>
              </linearGradient>
            </defs>
            <path d={arc} fill="url(#hero-sun)"/>
            {/* best window band */}
            <rect x={xFor(11)} y={6} width={xFor(14)-xFor(11)} height={H-22} fill="rgba(232,181,71,0.12)" stroke={TEE.sun} strokeOpacity="0.5" strokeDasharray="2 3" rx="3"/>
            {/* hour ticks */}
            {[6,9,12,15,18,21].map(h => (
              <g key={h}>
                <line x1={xFor(h)} y1={H-12} x2={xFor(h)} y2={H-9} stroke="rgba(251,250,246,0.3)"/>
                <text x={xFor(h)} y={H-1} fill="rgba(251,250,246,0.5)" fontSize="9.5" fontFamily={FONT_MONO} textAnchor="middle">{String(h).padStart(2,'0')}</text>
              </g>
            ))}
            {/* tee dots */}
            {course.teeTimes.filter((_,i) => i % 4 === 0 && course.teeTimes[i].avail > 0).map((tt,i) => {
              const px = xFor(tt.h + tt.m/60);
              const py = H - 14 - (course.hourly.find(h=>h.h===tt.h)?.sun || 0.5) * (H - 30);
              return <circle key={i} cx={px} cy={py} r="1.6" fill={TEE.cream}/>;
            })}
            <g transform={`translate(${xFor(12.5)}, ${H - 14 - 0.95*(H-30)})`}>
              <circle r="5" fill={TEE.sun}/>
              <circle r="9" fill="none" stroke={TEE.sun} strokeOpacity="0.4"/>
            </g>
          </svg>
        </div>

        <div style={{
          marginTop: 18, paddingTop: 16, borderTop: `1px solid rgba(251,250,246,0.12)`,
          display:'flex', alignItems:'baseline', justifyContent:'space-between',
        }}>
          <div>
            <div style={{ fontFamily: FONT_UI, fontSize: 10.5, letterSpacing: 1, textTransform:'uppercase', color: 'rgba(251,250,246,0.55)' }}>{t('bestNow')}</div>
            <div style={{ fontFamily: FONT_DISPLAY, fontSize: 28, fontWeight: 500, marginTop: 4 }}>12:24 — 13:48</div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: 'rgba(251,250,246,0.6)', marginTop: 4 }}>
              22° · 6 m/s · stimp 11.2 · 9 {t('free')}
            </div>
          </div>
          <button style={{
            appearance:'none', border:'none', cursor:'pointer',
            padding: '12px 18px', borderRadius: 999,
            background: TEE.cream, color: TEE.ink,
            fontFamily: FONT_UI, fontSize: 13, fontWeight: 500,
            display:'inline-flex', alignItems:'center', gap: 8,
          }}>
            {lang==='no'?'Bestill':'Book'}
            <Icon kind="arrow-right" size={13} strokeWidth={1.7}/>
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Today's windows — horizontal rail
// ─────────────────────────────────────────────────────────────
function WindowRail({ lang }) {
  const t = (k) => TEE_DATA.i18n[lang][k] || k;
  const courses = TEE_DATA.courses;
  const labelMap = {
    'golden': { en: 'Golden window', no: 'Gylden time' },
    'calm-after-wind': { en: 'Calm after wind', no: 'Stille etter vind' },
    'morning-calm': { en: 'Morning calm', no: 'Morgenstille' },
    'midday': { en: 'Midday', no: 'Midt på dagen' },
    'morning': { en: 'Morning', no: 'Morgen' },
  };
  return (
    <section style={{ padding: '40px 48px 16px' }}>
      <div style={{
        display:'flex', alignItems:'baseline', justifyContent:'space-between',
        marginBottom: 22,
      }}>
        <div>
          <div style={{ fontFamily: FONT_UI, fontSize: 11, letterSpacing: 1.2, textTransform:'uppercase', color: TEE.graphite }}>
            {lang==='no'?'I dag':'Today'}
          </div>
          <h2 style={{
            fontFamily: FONT_DISPLAY, fontSize: 32, fontWeight: 400, letterSpacing: -0.6,
            margin: '6px 0 0', color: TEE.ink,
          }}>
            {lang==='no'?<>Dagens <span style={{ fontStyle:'italic', color: TEE.moss }}>vinduer</span></>
                        :<>Today's <span style={{ fontStyle:'italic', color: TEE.moss }}>windows</span></>}
          </h2>
        </div>
        <a href="#" style={{
          fontFamily: FONT_UI, fontSize: 13, color: TEE.ink2, textDecoration:'none',
          display:'inline-flex', alignItems:'center', gap: 6,
        }}>
          {lang==='no'?'Alle vinduer':'All windows'}
          <Icon kind="arrow-right" size={13}/>
        </a>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 16 }}>
        {courses.slice(0, 4).map(c => {
          const cur = c.hourly?.find(h => h.h === c.window.start) || {};
          const lbl = labelMap[c.window.label]?.[lang] || c.window.label;
          return (
            <div key={c.id} style={{
              background: TEE.cream, borderRadius: 18, overflow: 'hidden',
              border: `1px solid ${TEE.hairline2}`,
              boxShadow: '0 1px 0 rgba(14,20,16,0.04)',
              cursor: 'pointer',
            }}>
              <div style={{ position:'relative', height: 130 }}>
                <HeroLandscape kind={c.hero} height={130}/>
                <div style={{ position:'absolute', left: 12, top: 12 }}>
                  <span style={{
                    display:'inline-flex', alignItems:'center', gap: 5,
                    padding: '4px 10px', borderRadius: 999,
                    background: 'rgba(251,250,246,0.85)', backdropFilter:'blur(6px)',
                    fontFamily: FONT_UI, fontSize: 10, letterSpacing: 0.6, textTransform:'uppercase',
                    color: TEE.ink, fontWeight: 600,
                  }}>
                    <span style={{ width: 5, height: 5, borderRadius: 999, background: TEE.sun }}/>
                    {lbl}
                  </span>
                </div>
              </div>
              <div style={{ padding: 16 }}>
                <div style={{ fontFamily: FONT_DISPLAY, fontSize: 19, fontWeight: 500, letterSpacing: -0.3, color: TEE.ink }}>{c.name}</div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: TEE.graphite, marginTop: 4 }}>
                  {String(c.window.start).padStart(2,'0')}:00 — {String(c.window.end).padStart(2,'0')}:00
                </div>
                <div style={{
                  marginTop: 12, paddingTop: 12, borderTop: `1px solid ${TEE.hairline2}`,
                  display:'flex', justifyContent:'space-between', alignItems:'center',
                  fontFamily: FONT_MONO, fontSize: 11, color: TEE.ink2,
                }}>
                  <span>{cur.t || 18}° · {cur.w || 5} m/s</span>
                  <span style={{ color: TEE.graphite }}>{lang==='no'?'fra':'from'} {fmtKr(c.priceOff)}</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

// ─────────────────────────────────────────────────────────────
// Editorial feature
// ─────────────────────────────────────────────────────────────
function Feature({ lang }) {
  const t = (k) => TEE_DATA.i18n[lang][k] || k;
  const course = TEE_DATA.courses.find(c => c.id === 'larvik');
  return (
    <section style={{ padding: '40px 48px' }}>
      <div style={{
        background: TEE.ink, color: TEE.cream, borderRadius: 24, overflow: 'hidden',
        display:'grid', gridTemplateColumns: '1.1fr 1fr',
      }}>
        <div style={{ position:'relative', minHeight: 460 }}>
          <HeroLandscape kind={course.hero} height={460} style={{ height: '100%' }}/>
          <div style={{
            position:'absolute', inset: 0,
            background: 'linear-gradient(90deg, rgba(14,20,16,0.1) 60%, rgba(14,20,16,0.65))',
          }}/>
          <div style={{ position:'absolute', left: 32, bottom: 28 }}>
            <span style={{
              display:'inline-flex', alignItems:'center', gap: 6,
              padding: '6px 12px', borderRadius: 999,
              background: 'rgba(251,250,246,0.15)', backdropFilter:'blur(8px)',
              fontFamily: FONT_UI, fontSize: 10.5, letterSpacing: 1, textTransform:'uppercase',
              color: TEE.cream, border: '1px solid rgba(251,250,246,0.2)',
            }}>{lang==='no'?'Ukens bane':'Course of the week'}</span>
          </div>
        </div>
        <div style={{ padding: '52px 48px', display:'flex', flexDirection:'column', justifyContent:'center' }}>
          <div style={{
            fontFamily: FONT_UI, fontSize: 11, letterSpacing: 1.2, textTransform:'uppercase',
            color: 'rgba(251,250,246,0.55)',
          }}>{course.location} · {course.region}</div>
          <h3 style={{
            fontFamily: FONT_DISPLAY, fontSize: 56, fontWeight: 400, letterSpacing: -1.6,
            lineHeight: 0.95, margin: '12px 0 0', color: TEE.cream,
          }}>{course.name}</h3>
          <p style={{
            fontFamily: FONT_DISPLAY, fontSize: 19, fontStyle: 'italic',
            color: 'rgba(251,250,246,0.75)', lineHeight: 1.45, margin: '20px 0 0',
          }}>"{course.signature[lang]}"</p>

          <div style={{
            display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 18,
            marginTop: 36, paddingTop: 28, borderTop: `1px solid rgba(251,250,246,0.14)`,
          }}>
            {[
              { l: 'Par', v: course.par },
              { l: 'Stimp', v: course.conditions.greenSpeed.toFixed(1) },
              { l: lang==='no'?'Lengde':'Length', v: `${course.length}m` },
              { l: lang==='no'?'Vurdering':'Rating', v: course.rating },
            ].map((s, i) => (
              <div key={i}>
                <div style={{ fontFamily: FONT_UI, fontSize: 10, letterSpacing: 1, textTransform:'uppercase', color: 'rgba(251,250,246,0.55)' }}>{s.l}</div>
                <div style={{ fontFamily: FONT_DISPLAY, fontSize: 26, fontWeight: 500, marginTop: 6, color: TEE.cream, letterSpacing: -0.4 }}>{s.v}</div>
              </div>
            ))}
          </div>
          <div style={{ marginTop: 32, display:'flex', gap: 10 }}>
            <button style={{
              appearance:'none', border:'none', cursor:'pointer',
              padding: '13px 22px', borderRadius: 999,
              background: TEE.cream, color: TEE.ink,
              fontFamily: FONT_UI, fontSize: 13.5, fontWeight: 500,
            }}>{lang==='no'?'Se vinduet':'See the Window'}</button>
            <button style={{
              appearance:'none', cursor:'pointer',
              padding: '13px 22px', borderRadius: 999,
              background: 'transparent', color: TEE.cream,
              border: `1px solid rgba(251,250,246,0.25)`,
              fontFamily: FONT_UI, fontSize: 13.5, fontWeight: 500,
            }}>{lang==='no'?'Mer om banen':'About the course'}</button>
          </div>
        </div>
      </div>
    </section>
  );
}

// ─────────────────────────────────────────────────────────────
// Course list + side map
// ─────────────────────────────────────────────────────────────
function ListAndMap({ lang }) {
  const t = (k) => TEE_DATA.i18n[lang][k] || k;
  const [filter, setFilter] = useState('all');
  const filters = lang === 'no'
    ? [['all','Alle'],['near','Nær meg'],['windows','Med vindu nå'],['twilight','Tussmørke'],['18','18 hull'],['9','9 hull']]
    : [['all','All'],['near','Near me'],['windows','Windows now'],['twilight','Twilight'],['18','18 holes'],['9','9 holes']];
  const courses = TEE_DATA.courses;

  return (
    <section style={{ padding: '20px 48px 60px' }}>
      <div style={{
        display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom: 22,
      }}>
        <h2 style={{
          fontFamily: FONT_DISPLAY, fontSize: 32, fontWeight: 400, letterSpacing: -0.6,
          margin: 0, color: TEE.ink,
        }}>
          {lang==='no'?<>Alle <span style={{ fontStyle:'italic', color: TEE.moss }}>baner</span></>
                      :<>All <span style={{ fontStyle:'italic', color: TEE.moss }}>courses</span></>}
        </h2>
        <div style={{ display:'flex', gap: 8 }}>
          {filters.map(([k, l]) => (
            <button key={k} onClick={() => setFilter(k)} style={{
              appearance:'none', cursor:'pointer',
              padding: '8px 14px', borderRadius: 999,
              fontFamily: FONT_UI, fontSize: 12.5, fontWeight: 500,
              background: filter === k ? TEE.ink : 'transparent',
              color: filter === k ? TEE.cream : TEE.ink2,
              border: filter === k ? '1px solid '+TEE.ink : `1px solid ${TEE.hairline}`,
            }}>{l}</button>
          ))}
        </div>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'1.4fr 1fr', gap: 24 }}>
        {/* List */}
        <div style={{ display:'flex', flexDirection:'column', gap: 12 }}>
          {courses.map(c => {
            const cur = c.hourly?.find(h => h.h === 14) || {};
            return (
              <div key={c.id} style={{
                background: TEE.cream, borderRadius: 18, overflow:'hidden',
                border: `1px solid ${TEE.hairline2}`,
                display:'grid', gridTemplateColumns:'200px 1fr auto',
                cursor:'pointer',
              }}>
                <div style={{ position:'relative' }}>
                  <HeroLandscape kind={c.hero} height={150} style={{ height:'100%' }}/>
                </div>
                <div style={{ padding: '18px 22px' }}>
                  <div style={{
                    fontFamily: FONT_UI, fontSize: 10.5, letterSpacing: 1, textTransform:'uppercase',
                    color: TEE.graphite, marginBottom: 4,
                  }}>{c.region}</div>
                  <div style={{ fontFamily: FONT_DISPLAY, fontSize: 24, fontWeight: 500, letterSpacing: -0.4, color: TEE.ink }}>
                    {c.name}
                  </div>
                  <div style={{
                    fontFamily: FONT_DISPLAY, fontSize: 14, fontStyle:'italic',
                    color: TEE.ink2, marginTop: 6, lineHeight: 1.4, maxWidth: 480,
                  }}>{c.blurb[lang]}</div>
                  <div style={{ marginTop: 14, display:'flex', alignItems:'center', gap: 18 }}>
                    <ConditionsRow course={c} t={t} compact/>
                    <span style={{
                      display:'inline-flex', alignItems:'center', gap: 4,
                      fontFamily: FONT_MONO, fontSize: 11, color: TEE.ink2,
                    }}>
                      <Icon kind="car" size={12} color={TEE.graphite} strokeWidth={1.4}/>
                      {c.driveMin} {t('mins')}
                    </span>
                    <span style={{
                      display:'inline-flex', alignItems:'center', gap: 4,
                      fontFamily: FONT_MONO, fontSize: 11, color: TEE.ink2,
                    }}>
                      <Icon kind="star" size={11} color={TEE.ink2}/>
                      {c.rating}
                    </span>
                  </div>
                </div>
                <div style={{
                  padding: '18px 22px', textAlign:'right',
                  display:'flex', flexDirection:'column', justifyContent:'space-between',
                  alignItems:'flex-end', borderLeft: `1px solid ${TEE.hairline2}`, minWidth: 160,
                }}>
                  <div>
                    <div style={{
                      display:'inline-flex', alignItems:'center', gap: 5,
                      fontFamily: FONT_UI, fontSize: 9.5, letterSpacing: 0.8, textTransform:'uppercase',
                      color: TEE.graphite,
                    }}>
                      <span style={{ width: 5, height: 5, borderRadius: 999, background: TEE.sun }}/>
                      {lang==='no'?'Vindu':'Window'}
                    </div>
                    <div style={{ fontFamily: FONT_MONO, fontSize: 13, color: TEE.ink, fontWeight: 500, marginTop: 4 }}>
                      {String(c.window.start).padStart(2,'0')}:00–{String(c.window.end).padStart(2,'0')}:00
                    </div>
                  </div>
                  <div style={{ marginTop: 12 }}>
                    <div style={{ fontFamily: FONT_UI, fontSize: 10, color: TEE.graphite, letterSpacing: 0.4, textTransform:'uppercase' }}>{lang==='no'?'fra':'from'}</div>
                    <div style={{ fontFamily: FONT_DISPLAY, fontSize: 22, fontWeight: 500, color: TEE.ink, marginTop: 2, letterSpacing: -0.3 }}>
                      {fmtKr(c.priceOff)}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Map */}
        <div style={{
          background: TEE.cream, borderRadius: 18, overflow:'hidden',
          border: `1px solid ${TEE.hairline2}`, position: 'sticky', top: 96, height: 720,
          display:'flex', flexDirection:'column',
        }}>
          <FauxMap lang={lang}/>
        </div>
      </div>
    </section>
  );
}

function FauxMap({ lang }) {
  const t = (k) => TEE_DATA.i18n[lang][k] || k;
  const courses = TEE_DATA.courses;
  // hand-positioned pseudo-coords (Norway-ish)
  const pins = [
    { id: 'losby',     x: 0.62, y: 0.40, label: 'Losby' },
    { id: 'larvik',    x: 0.50, y: 0.78, label: 'Larvik' },
    { id: 'miklagard', x: 0.66, y: 0.32, label: 'Miklagard' },
    { id: 'tyrifjord', x: 0.42, y: 0.46, label: 'Tyrifjord' },
    { id: 'atlungstad',x: 0.70, y: 0.22, label: 'Atlungstad' },
  ];
  return (
    <div style={{
      flex: 1, position:'relative',
      background: '#E5E0CF',
      backgroundImage: `
        radial-gradient(circle at 30% 80%, rgba(62,85,98,0.4), transparent 20%),
        radial-gradient(circle at 50% 60%, rgba(62,85,98,0.25), transparent 14%),
        radial-gradient(circle at 70% 30%, rgba(62,85,98,0.18), transparent 10%),
        radial-gradient(circle at 25% 25%, rgba(58,82,54,0.18), transparent 28%),
        radial-gradient(circle at 80% 75%, rgba(58,82,54,0.14), transparent 22%)
      `,
    }}>
      {/* topo lines */}
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}>
        {Array.from({length: 10}, (_,i) => (
          <path key={i} d={`M 0 ${30+i*7} Q 30 ${25+i*7} 60 ${35+i*7} T 100 ${30+i*7}`}
            fill="none" stroke="rgba(14,20,16,0.05)" strokeWidth="0.2"/>
        ))}
        {/* coastline */}
        <path d="M 0 95 C 20 88, 35 92, 50 90 S 80 80, 100 85 L 100 100 L 0 100 Z"
          fill="rgba(62,85,98,0.4)"/>
      </svg>
      {/* pins */}
      {pins.map((p, i) => (
        <div key={p.id} style={{
          position:'absolute', left: `${p.x*100}%`, top: `${p.y*100}%`,
          transform: 'translate(-50%, -100%)',
        }}>
          <div style={{
            display:'flex', alignItems:'center', gap: 6,
            padding: '6px 10px 6px 6px', borderRadius: 999,
            background: i === 2 ? TEE.ink : TEE.cream,
            color: i === 2 ? TEE.cream : TEE.ink,
            fontFamily: FONT_UI, fontSize: 11.5, fontWeight: 500,
            boxShadow: '0 6px 14px -4px rgba(14,20,16,0.3)',
            border: i === 2 ? 'none' : `1px solid ${TEE.hairline2}`,
            whiteSpace: 'nowrap',
          }}>
            <span style={{
              width: 18, height: 18, borderRadius: 999,
              background: i === 2 ? TEE.sun : TEE.moss,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontFamily: FONT_MONO, fontSize: 9, color: TEE.cream, fontWeight: 600,
            }}>{p.label[0]}</span>
            <span>{p.label}</span>
          </div>
          <div style={{
            width: 0, height: 0, margin: '0 auto',
            borderLeft: '5px solid transparent', borderRight: '5px solid transparent',
            borderTop: `6px solid ${i === 2 ? TEE.ink : TEE.cream}`,
          }}/>
        </div>
      ))}

      {/* legend overlay */}
      <div style={{
        position:'absolute', left: 16, bottom: 16,
        background: 'rgba(251,250,246,0.92)', backdropFilter:'blur(8px)',
        borderRadius: 12, padding: '10px 14px',
        fontFamily: FONT_UI, fontSize: 11.5, color: TEE.ink2,
        border: `1px solid ${TEE.hairline2}`,
        display:'flex', alignItems:'center', gap: 14,
      }}>
        <span style={{ display:'inline-flex', alignItems:'center', gap: 6 }}>
          <span style={{ width: 10, height: 10, borderRadius: 999, background: TEE.moss }}/>
          {lang==='no'?'Ledig nå':'Open now'}
        </span>
        <span style={{ display:'inline-flex', alignItems:'center', gap: 6 }}>
          <span style={{ width: 10, height: 10, borderRadius: 999, background: TEE.sun }}/>
          {lang==='no'?'Perfekt vindu':'Perfect window'}
        </span>
      </div>
      <div style={{
        position:'absolute', right: 16, top: 16,
        display:'flex', flexDirection:'column', gap: 4,
      }}>
        {['+','−'].map((s, i) => (
          <button key={i} style={{
            width: 32, height: 32, borderRadius: 8,
            border: `1px solid ${TEE.hairline2}`, background: TEE.cream,
            cursor:'pointer', fontFamily: FONT_UI, fontSize: 16, color: TEE.ink2,
          }}>{s}</button>
        ))}
      </div>
    </div>
  );
}

      padding: '60px 48px 40px',
      borderTop: `1px solid ${TEE.hairline2}`,
      background: TEE.paper,
    }}>
      <div style={{ display:'grid', gridTemplateColumns: '2fr 1fr 1fr 1fr', gap: 48 }}>
        <div>
          <BrandMark size={32}/>
          <p style={{
            fontFamily: FONT_DISPLAY, fontSize: 17, fontStyle:'italic',
            color: TEE.ink2, lineHeight: 1.4, margin: '14px 0 0', maxWidth: 360,
          }}>
            {lang==='no'
              ? '"Vi behandler tee-tid som en flyplass-bestilling. Det burde være mer som en restaurantkveld."'
              : '"We treat tee time like an airport booking. It should feel like dinner at a restaurant."'}
          </p>
          <div style={{ marginTop: 22, display:'flex', gap: 12 }}>
            <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: TEE.graphite, padding:'5px 10px', borderRadius:999, border:`1px solid ${TEE.hairline}` }}>iOS</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: TEE.graphite, padding:'5px 10px', borderRadius:999, border:`1px solid ${TEE.hairline}` }}>Android</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: TEE.graphite, padding:'5px 10px', borderRadius:999, border:`1px solid ${TEE.hairline}` }}>Web</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: TEE.graphite, padding:'5px 10px', borderRadius:999, border:`1px solid ${TEE.hairline}` }}>Wallet</span>
          </div>
        </div>
        {[
          { h: lang==='no'?'Spille':'Play',     items: lang==='no'?['Oppdag','Klubber','Turneringer','Twilight']:['Discover','Clubs','Tournaments','Twilight'] },
          { h: lang==='no'?'Selskap':'Company', items: lang==='no'?['Om tee.','Karriere','Presse','Kontakt']:['About','Careers','Press','Contact'] },
          { h: lang==='no'?'Hjelp':'Help',      items: lang==='no'?['Avbestilling','Vipps','Personvern','Vilkår']:['Cancellation','Payment','Privacy','Terms'] },
        ].map((col, i) => (
          <div key={i}>
            <div style={{ fontFamily: FONT_UI, fontSize: 11, letterSpacing: 1, textTransform:'uppercase', color: TEE.graphite, marginBottom: 14 }}>{col.h}</div>
            {col.items.map((x, j) => (
              <div key={j} style={{ fontFamily: FONT_UI, fontSize: 13.5, color: TEE.ink2, marginBottom: 10 }}>{x}</div>
            ))}
          </div>
        ))}
      </div>
      <div style={{
        marginTop: 48, paddingTop: 24, borderTop: `1px solid ${TEE.hairline2}`,
        display:'flex', justifyContent:'space-between',
        fontFamily: FONT_MONO, fontSize: 11, color: TEE.graphite,
      }}>
        <span>© 2026 tee. AS · Org.nr 932 174 002 · Oslo</span>
        <span>{lang==='no'?'Laget med vind, sol og litt regn ⛳':'Made with wind, sun, and a little rain ⛳'}</span>
      </div>

}

    <div style={{ background: TEE.paper, minHeight: '100%', color: TEE.ink }}>

  const [lang, setLang] = useState('no');
  return (
    <div className="stage">
      <ChromeWindow

}
