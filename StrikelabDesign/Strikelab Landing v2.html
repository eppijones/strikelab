<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StrikeLab — All golfen din på ett sted.</title>
<meta name="description" content="Join StrikeLab. Gratis scorekort. Ingen abonnement. Laget av golfere, for golfere."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #F2EDE0; height: 100%; }
  body {
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: #0E1410;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden; /* one-pager — no scroll */
  }
  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { display: none; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: rgba(26,61,46,0.18); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="landing-devices.jsx"></script>
<script type="text/babel" src="landing-variants.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "constellation",
  "lang": "no",
  "headlineMode": "static"
}/*EDITMODE-END*/;

const VARIANTS = [
  { id: 'signature',     name: 'A · Signaturhullet',      sub: 'Editorial topografi · slag-spor tegnes' },
  { id: 'day',           name: 'B · En dag, tre øyeblikk', sub: 'Booke → spille → gjennomgå · cycler 5 s' },
  { id: 'numbers',       name: 'C · Tallene',              sub: 'Tickende statistikk · editorial type' },
  { id: 'constellation', name: 'D · Økosystem',            sub: 'Merket eksploderer i et spredningsfelt' },
];

const URLS = {
  appStore:  'https://apps.apple.com/app/strikelab-caddie/idXXXXXXXXX',
  teeDemo:   'Tee Booking.html',
  login:     '#login',
  instagram: 'https://www.instagram.com/strikelab.golf',
};

const COPY = {
  no: {
    login: 'Logg inn',
    eyebrow: 'JOIN STRIKELAB',
    h1a: 'All golfen din',
    h1b: 'på ett sted.',
    sub: 'Gratis scorekort. Ingen abonnement. Laget av golfere, for golfere.',
    follow: 'Følg oss på Instagram',
    download: 'Last ned i App Store',
    downloadTop: 'Last ned i',
    downloadBig: 'App Store',
    teeCta: 'StrikeLab Tee · Live demo',
    feats: ['Scorekort, gjort skikkelig.', 'Trackman + Toppgolf range import.', 'Bag som lærer av slagene dine.'],
  },
  en: {
    login: 'Sign in',
    eyebrow: 'JOIN STRIKELAB',
    h1a: 'All your golf',
    h1b: 'in one place.',
    sub: 'Free scorecards. No subscription. Made by golfers, for golfers.',
    follow: 'Follow us on Instagram',
    download: 'Download on the App Store',
    downloadTop: 'Download on the',
    downloadBig: 'App Store',
    teeCta: 'StrikeLab Tee · Live demo',
    feats: ['Scorecards, done right.', 'Trackman + Topgolf range import.', 'A bag that learns from your shots.'],
  },
};

// Variant-specific headline overrides for variant B (when rotation is on).
function copyForVariant(t, variant, frame, mode) {
  if (variant !== 'day' || mode !== 'rotating') return { h1a: t.h1a, h1b: t.h1b, sub: t.sub };
  const f = DAY_FRAMES[frame];
  return {
    h1a: f.headline[t === COPY.no ? 'no' : 'en'].split(',')[0] + ',',
    h1b: f.headline[t === COPY.no ? 'no' : 'en'].split(',').slice(1).join(',').trim(),
    sub: f.sub[t === COPY.no ? 'no' : 'en'],
  };
}

// ─────────────────────────────────────────────────────────────
// App Store badge (kept inline so this file is self-sufficient)
// ─────────────────────────────────────────────────────────────
function AppStoreBadge({ height = 54, t }) {
  const W = (height / 56) * 168;
  return (
    <a href={URLS.appStore} target="_blank" rel="noopener noreferrer"
       aria-label={`${t.downloadTop} ${t.downloadBig}`}
       style={{ display:'inline-block', lineHeight: 0 }}>
      <svg viewBox="0 0 168 56" width={W} height={height} style={{ display:'block' }}>
        <rect x="0" y="0" width="168" height="56" rx="10" fill="#000"/>
        <rect x="0.5" y="0.5" width="167" height="55" rx="9.5" fill="none" stroke="rgba(255,255,255,0.08)"/>
        <g transform="translate(16, 13)">
          <path fill="#fff" d="M14.6 13.7c-.02-2.1 1.72-3.12 1.8-3.17-.98-1.43-2.5-1.62-3.04-1.65-1.29-.13-2.52.76-3.18.76-.68 0-1.68-.74-2.76-.72-1.42.02-2.73.82-3.46 2.09-1.47 2.55-.38 6.34 1.06 8.41.7 1.01 1.55 2.15 2.62 2.11 1.05-.04 1.45-.68 2.7-.68 1.27 0 1.62.68 2.72.66 1.13-.02 1.84-1.03 2.52-2.04.8-1.18 1.13-2.31 1.15-2.37-.03-.01-2.2-.84-2.22-3.33zM12.5 7.16c.57-.7.96-1.65.86-2.6-.83.04-1.83.55-2.42 1.25-.53.62-1 1.6-.88 2.52.92.07 1.86-.47 2.44-1.17z"/>
        </g>
        <text x="46" y="22" fill="#fff" fontFamily="-apple-system, 'SF Pro Display', Helvetica, Arial" fontSize="9.5" letterSpacing="0.2">{t.downloadTop}</text>
        <text x="46" y="42" fill="#fff" fontFamily="-apple-system, 'SF Pro Display', Helvetica, Arial" fontSize="20" fontWeight="600" letterSpacing="-0.4">{t.downloadBig}</text>
      </svg>
    </a>
  );
}

function ArrowGlyph({ size = 14, color = 'currentColor', strokeWidth = 1.7 }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" aria-hidden="true" style={{ display:'block' }}>
      <path d="M5 12h14M13 6l6 6-6 6" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function InstagramGlyph({ size = 14, color = 'currentColor', strokeWidth = 1.5 }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" aria-hidden="true" style={{ display:'block' }}>
      <rect x="3" y="3" width="18" height="18" rx="5" stroke={color} strokeWidth={strokeWidth}/>
      <circle cx="12" cy="12" r="4" stroke={color} strokeWidth={strokeWidth}/>
      <circle cx="17.5" cy="6.5" r="0.9" fill={color}/>
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────
// Top bar
// ─────────────────────────────────────────────────────────────
function TopBar({ lang, setLang, t }) {
  return (
    <header style={{
      position: 'absolute', top: 0, left: 0, right: 0, zIndex: 50,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '22px 40px',
    }}>
      <a href="/" style={{ display:'flex', alignItems:'center' }}>
        <StrikelabLogo size={22}/>
      </a>
      <div style={{ display:'flex', alignItems:'center', gap: 16 }}>
        <div style={{
          display:'inline-flex', border: `1px solid ${SL.hairline}`,
          borderRadius: 999, padding: 2, background: 'rgba(251,250,246,0.55)',
          backdropFilter: 'blur(8px)',
        }}>
          {['no','en'].map(L => (
            <button key={L} onClick={() => setLang(L)} style={{
              appearance:'none', border:'none', cursor:'pointer',
              padding:'4px 9px', borderRadius: 999,
              background: lang === L ? SL.ink : 'transparent',
              color: lang === L ? SL.surface : SL.graphite,
              fontFamily:'"Geist", system-ui, sans-serif',
              fontWeight: 500, fontSize: 10.5, letterSpacing: 0.6,
              textTransform: 'uppercase',
            }}>{L}</button>
          ))}
        </div>
        <a href={URLS.login} style={{
          fontFamily: '"Geist", system-ui, sans-serif',
          fontSize: 13, color: SL.ink2,
          padding: '8px 14px', borderRadius: 999,
          border: `1px solid ${SL.hairline}`,
          background: 'rgba(251,250,246,0.55)',
          backdropFilter: 'blur(8px)',
        }}>{t.login}</a>
      </div>
    </header>
  );
}

// ─────────────────────────────────────────────────────────────
// Hero
// ─────────────────────────────────────────────────────────────
function Hero({ lang, t, tweaks, setTweak }) {
  const [dayFrame, setDayFrame] = useState(0);
  const [cycleKey, setCycleKey] = useState(0);

  // Variant C / D re-trigger their counters/animations periodically.
  useEffect(() => {
    if (tweaks.variant === 'numbers' || tweaks.variant === 'constellation') {
      const id = setInterval(() => setCycleKey(k => k + 1), 7200);
      return () => clearInterval(id);
    }
  }, [tweaks.variant]);

  // Pick headline copy (B can rotate with the cycle)
  const headlines = copyForVariant(t, tweaks.variant, dayFrame, tweaks.headlineMode);

  // Each variant has slightly different left-column emphasis
  const isNumbers = tweaks.variant === 'numbers';

  return (
    <main style={{
      height: '100vh', width: '100vw',
      display: 'grid',
      gridTemplateColumns: isNumbers ? 'minmax(0, 0.85fr) minmax(0, 1.15fr)' : 'minmax(0, 1fr) minmax(0, 1.05fr)',
      position: 'relative',
      background: `
        radial-gradient(ellipse 600px 400px at 12% 88%, rgba(26,61,46,0.08), transparent 60%),
        radial-gradient(ellipse 500px 350px at 90% 12%, rgba(232,181,71,0.10), transparent 60%),
        ${SL.bg}
      `,
    }}>
      {/* LEFT — copy & CTAs */}
      <section style={{
        padding: '110px 56px 70px',
        display: 'flex', flexDirection: 'column', justifyContent: 'center',
        maxWidth: 720,
      }}>
        <Eyebrow>{t.eyebrow}</Eyebrow>

        <h1 key={tweaks.variant + '-' + dayFrame + '-' + tweaks.headlineMode} style={{
          fontFamily: '"Newsreader", Georgia, serif',
          fontSize: 'clamp(54px, 6.2vw, 96px)',
          fontWeight: 400, letterSpacing: -3.2, lineHeight: 0.95,
          margin: '24px 0 0', color: SL.ink, textWrap: 'balance',
          transition: 'opacity 500ms cubic-bezier(0.22,1,0.36,1)',
        }}>
          {headlines.h1a}<br/>
          <span style={{ fontStyle: 'italic', color: SL.moss, fontWeight: 400 }}>{headlines.h1b}</span>
        </h1>

        <p style={{
          fontFamily: '"Newsreader", Georgia, serif',
          fontSize: 'clamp(17px, 1.5vw, 21px)',
          fontStyle: 'italic', color: SL.ink2, lineHeight: 1.45,
          margin: '24px 0 0', maxWidth: 540,
        }}>{headlines.sub}</p>

        {/* Feature list */}
        <ul style={{
          listStyle: 'none', padding: 0, margin: '28px 0 0',
          display: 'flex', flexDirection: 'column', gap: 10, maxWidth: 520,
        }}>
          {t.feats.map((f, i) => (
            <li key={i} style={{
              display: 'flex', alignItems: 'baseline', gap: 14,
              fontFamily: '"Geist", system-ui, sans-serif',
              fontSize: 15, color: SL.ink2,
            }}>
              <span style={{
                fontFamily: '"Geist Mono", ui-monospace, monospace',
                fontSize: 11, color: SL.graphite, letterSpacing: 0.4, minWidth: 22,
              }}>{String(i+1).padStart(2,'0')}</span>
              {f}
            </li>
          ))}
        </ul>

        {/* CTA row */}
        <div style={{ marginTop: 36, display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <AppStoreBadge height={54} t={t}/>
          <a href={URLS.teeDemo} target="_blank" rel="noopener noreferrer" style={{
            display: 'inline-flex', alignItems: 'center', gap: 10,
            height: 54, padding: '0 22px', borderRadius: 10,
            background: 'transparent', border: `1px solid ${SL.ink}`,
            color: SL.ink, fontFamily: '"Geist", system-ui, sans-serif',
            fontSize: 14, fontWeight: 500,
          }}>
            {t.teeCta}
            <ArrowGlyph size={14} color={SL.ink} strokeWidth={1.7}/>
          </a>
        </div>
      </section>

      {/* RIGHT — variant visual */}
      <section style={{ position: 'relative', padding: '90px 24px 70px' }}>
        {tweaks.variant === 'signature'     && <VariantSignature lang={lang} t={t}/>}
        {tweaks.variant === 'day'           && <VariantDayInThree lang={lang} t={t} frame={dayFrame} setFrame={setDayFrame}/>}
        {tweaks.variant === 'numbers'       && <VariantNumbers lang={lang} t={t} cycleKey={cycleKey}/>}
        {tweaks.variant === 'constellation' && <VariantConstellation lang={lang} t={t} cycleKey={cycleKey}/>}
      </section>

      {/* Bottom strip */}
      <footer style={{
        position: 'absolute', left: 0, right: 0, bottom: 0,
        padding: '18px 40px', display: 'flex',
        justifyContent: 'space-between', alignItems: 'center',
        fontFamily: '"Geist Mono", ui-monospace, monospace',
        fontSize: 11, color: SL.graphite, letterSpacing: 0.6, textTransform: 'uppercase',
        borderTop: `1px solid ${SL.hairline2}`,
        background: 'rgba(242,237,224,0.55)',
        backdropFilter: 'blur(8px)',
        zIndex: 20,
      }}>
        <span>© 2026 STRIKELAB · strikelab.golf · {VARIANTS.find(v => v.id === tweaks.variant)?.name}</span>
        <div style={{ display:'flex', alignItems:'center', gap: 22 }}>
          <a href={URLS.appStore} target="_blank" rel="noopener noreferrer"
             style={{ display:'inline-flex', alignItems:'center', gap: 8, color: SL.ink2 }}>
            <ArrowGlyph size={12} color="currentColor" strokeWidth={1.7}/>
            {t.download}
          </a>
          <a href={URLS.instagram} target="_blank" rel="noopener noreferrer"
             style={{ display:'inline-flex', alignItems:'center', gap: 8, color: SL.ink2 }}>
            <InstagramGlyph size={14}/>
            {t.follow} — @strikelab.golf
          </a>
        </div>
      </footer>
    </main>
  );
}

// ─────────────────────────────────────────────────────────────
// App
// ─────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Mirror the variant's preferred default language? Keep user pref.
  const lang = tweaks.lang;
  const t = COPY[lang];

  return (
    <div style={{ position: 'relative', width: '100vw', height: '100vh', overflow: 'hidden' }}>
      <TopBar lang={lang} setLang={(L) => setTweak('lang', L)} t={t}/>
      <Hero lang={lang} t={t} tweaks={tweaks} setTweak={setTweak}/>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Hero variant">
          {VARIANTS.map(v => (
            <button key={v.id} onClick={() => setTweak('variant', v.id)} style={{
              appearance:'none', textAlign:'left', cursor:'pointer',
              padding: '10px 12px', borderRadius: 10,
              border: `1px solid ${tweaks.variant === v.id ? SL.ink : SL.hairline2}`,
              background: tweaks.variant === v.id ? SL.ink : SL.surface,
              color: tweaks.variant === v.id ? SL.surface : SL.ink,
              marginBottom: 6, width: '100%',
              display: 'flex', flexDirection: 'column', gap: 2,
              transition: 'all 120ms',
            }}>
              <span style={{
                fontFamily: '"Geist", system-ui, sans-serif',
                fontSize: 12, fontWeight: 600,
              }}>{v.name}</span>
              <span style={{
                fontFamily: '"Geist Mono", ui-monospace, monospace',
                fontSize: 9.5, letterSpacing: 0.4,
                color: tweaks.variant === v.id ? 'rgba(251,250,246,0.6)' : SL.graphite,
              }}>{v.sub}</span>
            </button>
          ))}
        </TweakSection>

        <TweakSection label="Language">
          <TweakRadio label="Lang"
            value={tweaks.lang}
            options={[{ value:'no', label:'NO' }, { value:'en', label:'EN' }]}
            onChange={v => setTweak('lang', v)}/>
        </TweakSection>

        {tweaks.variant === 'day' && (
          <TweakSection label="Headline behaviour (B only)">
            <TweakRadio label="Mode"
              value={tweaks.headlineMode}
              options={[
                { value:'static',   label:'Static' },
                { value:'rotating', label:'Rotate with cycle' },
              ]}
              onChange={v => setTweak('headlineMode', v)}/>
          </TweakSection>
        )}
      </TweaksPanel>

      <style>{`
        @keyframes sl-h1-in {
          0% { opacity: 0; transform: translateY(8px); }
          100% { opacity: 1; transform: translateY(0); }
        }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
