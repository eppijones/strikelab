<style>
  :root {
    --bg: #0a0b0a;
    --bg-2: #111312;
    --surface: #151816;
    --surface-2: #1c1f1d;
    --line: #25292650;
    --line-strong: #2d322f;
    --ink: #ede8de;
    --ink-2: #b9b6ac;
    --ink-3: #76746b;
    --ink-4: #4a4842;
    --accent: oklch(0.88 0.18 125);   /* signal lime */
    --accent-2: oklch(0.78 0.18 125);
    --warn: oklch(0.78 0.16 65);       /* signal orange */
    --bad: oklch(0.68 0.20 28);
    --good: var(--accent);
  }
  html, body { background: #0c0d0c; color: var(--ink); margin: 0; }
  body { font-family: "Geist", system-ui, -apple-system, sans-serif; font-feature-settings: "ss01","cv11"; }
  * { box-sizing: border-box; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; font-feature-settings: "ss01","ss02","tnum","zero"; }
  .serif { font-family: "Instrument Serif", "Times New Roman", serif; font-style: italic; }
  .micro {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-3);
  }
</style>
