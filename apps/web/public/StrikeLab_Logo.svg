<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <!-- Background: Nordic Forest -->
  <rect width="200" height="200" fill="#1E3A2B"/>
  
  <!-- Container for Icon -->
  <g transform="translate(100, 80)">
    <!-- Icon: Scaled 3x from 24px center -->
    <g transform="scale(3) translate(-12, -12)">
      <circle cx="12" cy="12" r="3" fill="none" stroke="white" stroke-width="2"/>
      <path d="M12 2v4m0 12v4M2 12h4m12 0h4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Text: StrikeLab -->
  <text x="100" y="140" font-family="Inter, system-ui, sans-serif" font-weight="bold" font-size="24" fill="white" text-anchor="middle" letter-spacing="-0.5">StrikeLab</text>
  
  <!-- Subtext: GET DIALED IN -->
  <text x="100" y="160" font-family="Inter, system-ui, sans-serif" font-weight="bold" font-size="10" fill="#8EB897" text-anchor="middle" letter-spacing="2">GET DIALED IN</text>
